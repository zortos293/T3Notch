name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Pick the toolchain
        run: |
          # The image's default Xcode trails the newest one it carries, and the
          # app is built against 26.x locally; fall back rather than fail if the
          # image stops shipping it.
          for candidate in /Applications/Xcode_26.6.app /Applications/Xcode.app; do
            if [[ -d "$candidate" ]]; then
              echo "DEVELOPER_DIR=$candidate/Contents/Developer" >> "$GITHUB_ENV"
              break
            fi
          done

      - name: Test
        run: swift test

      # Packaging is part of the release path, so a break in it should surface
      # here rather than on the day a release is cut.
      - name: Build the app bundle
        run: Scripts/bundle.sh release
