name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: swift test

      # Packaging is part of the release path, so a break in it should surface
      # here rather than on the day a release is cut.
      - name: Build the app bundle
        run: Scripts/bundle.sh release
